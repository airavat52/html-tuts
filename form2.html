<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Project</title>
</head>
<body>
    <header>
        <h1>Event Registration</h1>
    </header>
    <main>
        <form action="">
            <label for="name">Name</label>
            <input type="text" id="name" name="name">
            <br><br>
            <label for="email">Email</label>
            <input type="email" name="email" id="email">
            <br><br>
            <label for="phone">Phone</label>
            <input type="tel" name="phone" id="phone" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}">
            <br><br>
            <label for="occupation">Occupation</label>
            <select name="occupation" id="occupation">
                <option value="" disabled selected hidden>-- Choose a Profession --</option>
                <option value="teacher">Teacher</option>
                <option value="student">Student</option>
                <option value="business">Business</option>
                <option value="admin">Administration</option>
                <option value="other">Other</option>
            </select>
            <br><br>
            <label for="interest">Topics of Interest: </label><br>
            <label for="html">HTML: 
                <input type="radio" name="interest" id="html" value="html" checked>
            </label>
            <label for="css">CSS: 
                <input type="radio" name="interest" id="css" value="css">
            </label>
            <label for="js">JavaScript: 
                <input type="radio" name="interest" id="js" value="js">
            </label>
            <br><br>
            <label for="comment">Comments: </label>
            <textarea name="comment" id="comment"></textarea>
            <button type="submit">Register</button>
        </form>
    </main>
</body>
</html>
