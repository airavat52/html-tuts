<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>    
</head>
<body>
    <form action=""> <!-- To create html forms to get user input-->
        <fieldset>
            <legend>Email Form</legend>
            <label for="email">Enter Your Email ID: </label> <!-- To Associate input element with a label -->
            <input type="email" id="email" placeholder="Enter Your Email ID" name="email"> <!-- Helps us to get input from users -->
            <br>
            <label for="password">Enter Your Password: </label>
            <input type="password" id="password" placeholder="Enter Your Password" name="password">
            <br>
        </fieldset>
        <fieldset>
            <legend>Junk Food Picker</legend>
            <label for="junk">Junk Food: </label>
            <select id="junk" multiple name="junk">
                <option value="maggi">Maggi</option>
                <option value="kurkure">Kurkure</option>
                <option value="chips">Chips</option>
            </select>
            <br>
            <label for="junk-des">Write about your favourite junk food: </label> <br>
            <textarea id="junk-des" placeholder="Write about your favourite junk food:" cols="15" rows="2" name="junk-des"></textarea>
        </fieldset>
        <button type="submit">Submit Form</button>
    </form>
</body>
</html>
